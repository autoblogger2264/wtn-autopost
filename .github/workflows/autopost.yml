name: wtn-autopost

# WTN AutoPost -- World Trend Network autonomous publisher.
# Runs every 30 minutes on GitHub's free tier (public repo = unlimited minutes).
# 48 runs/day x ~3 min = ~144 min/day -- free forever on a public repo.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:   # manual "Run workflow" button for testing

permissions:
  contents: write      # to commit status.json / seen.json back

# Never run two publishers at the same time: overlapping runs would read
# the same seen.json and publish the same stories twice.
concurrency:
  group: wtn-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run publisher
        env:
          HUNT_HOURS: ${{ vars.HUNT_HOURS || '2' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '3' }}
          MIN_SOURCES: ${{ vars.MIN_SOURCES || '3' }}
          BLOG_LANGUAGE: ${{ vars.BLOG_LANGUAGE || 'en' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python agent.py

      - name: Save run status
        run: |
          git config user.name "wtn-bot"
          git config user.email "wtn-bot@users.noreply.github.com"
          git add status.json seen.json || true
          git diff --cached --quiet || git commit -m "run status $(date -u +%F-%H%M)"
          git push
