# ============================================================================
#  WTN AUTOPOST v2 -- World Trend Network autonomous autoposter
#  Save as: .github/workflows/autopost.yml
#  Every 30 minutes: HUNT -> VERIFY -> PHOTO -> REWRITE -> PUBLISH (Blogger live)
#  -> SAVE status.json + seen.json.  Target: 1 post per run (48/day).
# ============================================================================

name: wtn-autopost
run-name: "WTN AutoPost ${{ github.event_name }}"

on:
  schedule:
    - cron: "*/30 * * * *"      # GitHub may delay scheduled runs a few minutes
  workflow_dispatch:            # manual "Run workflow" button

permissions:
  contents: write               # commit status.json / seen.json back

# Never two publishers at once (would duplicate posts).
concurrency:
  group: wtn-autopost
  cancel-in-progress: false

jobs:
  autopost:
    name: Hunt, verify, publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HUNT_HOURS: "2"               # first look: stories from the last 2h
      HUNT_FALLBACK_HOURS: "6"      # widen to 6h if fewer than MIN posts found
      MAX_POSTS_PER_RUN: "1"
      MIN_POSTS_PER_RUN: "1"
      RUN_BUDGET_SEC: "660"         # stop starting new stories after 11 min
      POST_GAP_SEC: "120"           # pause between posts (Blogger throttles bursts)
      BLOGGER_COOLDOWN_SEC: "90"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run WTN AutoPost
        id: autopost
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        # agent.py retries internally (network, Blogger 5xx, AI keys), and exits
        # non-zero ONLY for dead credentials -- so the run turns red exactly
        # when you must act. No blind whole-run retry (it only wasted minutes).
        run: python agent.py

      - name: Run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              s = json.load(open("status.json"))
              v = s.get("verifier", {})
              print(f"### WTN AutoPost -- {s['last_run']}")
              print(f"Posts this run: **{s.get('posts_this_run', 0)}** | "
                    f"Posts today: **{s['posts_today']}** | "
                    f"Total: **{s['posts_total']}** | "
                    f"Verified: **{v.get('passed', 0)}/{v.get('checked', 0)}**")
              for p in s.get("last_posts", [])[:3]:
                  print(f"- [{p['title']}]({p['url']})")
              for e in s.get("errors", []):
                  print(f"- ERROR: {e}")
          except Exception as ex:
              print(f"summary unavailable: {ex}")
          PY

      - name: Save run status (dedup memory + dashboard data)
        if: always()
        run: |
          git config user.name "wtn-autopost"
          git config user.email "wtn-autopost@users.noreply.github.com"
          git add status.json seen.json || true
          git diff --cached --quiet || git commit -m "autopost: $(date -u +%F_%H:%M_UTC)"
          for i in 1 2 3; do
            git push && exit 0
            echo "push failed, rebasing (try $i)"
            git pull --rebase --autostash -X theirs || git rebase --abort
            sleep 3
          done
          echo "::warning::could not push status files"
